<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>chair-configurator</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            html,
            body {
                overflow: hidden;
            }

            #webgl {
                position: fixed;
                top: 0;
                left: 0;
                outline: none;
            }

            .loading-overlay {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #faf9f6;
                color: #333;
                font-family: sans-serif;
                z-index: 10;
            }
            
            .loading-overlay__bar {
            width: 200px;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
            }

            .loading-overlay__fill {
            width: 0%;
            height: 100%;
            background: #d4622a;
            transition: width 200ms ease-out;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <canvas id="webgl"></canvas>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
