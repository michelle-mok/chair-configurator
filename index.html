<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>chair-configurator</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            html,
            body {
                overflow: hidden;
            }

            #webgl {
                position: fixed;
                top: 0;
                left: 0;
                outline: none;
            }

            .loading-overlay {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #faf9f6;
                color: #333;
                font-family: sans-serif;
                z-index: 10;
            }
            
            .loading-overlay__bar {
                width: 200px;
                height: 6px;
                background: #ddd;
                border-radius: 3px;
                overflow: hidden;
                margin-top: 12px;
            }

            .loading-overlay__fill {
                width: 0%;
                height: 100%;
                background: #d4622a;
                transition: width 200ms ease-out;
            }

            .configurator-panel {
                position: fixed;
                top: 0;
                right: 0;
                width: 260px;
                height: 100%;
                box-sizing: border-box;
                padding: 24px 20px;
                display: flex;
                flex-direction: column;
                gap: 24px;
                background: #ffffff;
                border-left: 1px solid #e5e2dc;
                font-family: sans-serif;
                overflow-y: auto;
                z-index: 5;
            }

            .configurator-panel__section {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .configurator-panel__label {
                font-size: 12px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #8a8378;
            }

            .configurator-panel__button {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border: 2px solid transparent;
                cursor: pointer;
                padding: 0;
            }

            .configurator-panel__button--active {
                border-color: #2c2a26;
            }
            
            .configurator-panel__price {
                margin-top: auto;
                font-size: 18px;
                color: #2c2a26;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <canvas id="webgl"></canvas>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
